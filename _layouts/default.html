<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | default: "Knowledgebase" }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
  <style>
    body { margin: 0; padding: 0; background-color: #fff; }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    @media (max-width: 767px) { .markdown-body { padding: 15px; } }

    /* Scratchpad FAB */
    .scratchpad-fab {
      position: fixed;
      bottom: 24px; right: 24px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background-color: #0066ff;
      color: white; border: none;
      font-size: 22px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .scratchpad-fab:hover { background-color: #0052cc; transform: scale(1.05); }

    /* Scratchpad Card */
    .scratchpad-card {
      position: fixed;
      bottom: 92px; right: 24px;
      width: 340px; height: 320px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid #e2e8f0;
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 1000;
    }
    .scratchpad-card.hidden { display: none; }
    .scratchpad-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0;
    }
    .scratchpad-title { font-weight: 600; color: #334155; font-size: 14px; }
    .scratchpad-actions button {
      background: none; border: none; cursor: pointer;
      font-size: 15px; padding: 4px 6px; border-radius: 4px;
    }
    .scratchpad-actions button:hover { background-color: #e2e8f0; }
    #scratchpad-input {
      flex: 1; padding: 14px; border: none; resize: none;
      outline: none; font-family: inherit; font-size: 14px; color: #1e293b;
    }
  </style>
</head>
<body>

  <!-- Native Rendered Page Content -->
  <main class="markdown-body">
    {{ content }}
  </main>

  <!-- Scratchpad Widget -->
  <button id="scratchpad-toggle-btn" class="scratchpad-fab" aria-label="Toggle Scratchpad">✏️</button>

  <div id="scratchpad-card" class="scratchpad-card hidden">
    <div class="scratchpad-header">
      <span class="scratchpad-title">Scratchpad</span>
      <div class="scratchpad-actions">
        <button id="sp-copy-btn" title="Copy to Clipboard">📋</button>
        <button id="sp-download-btn" title="Download Notes">⬇️</button>
        <button id="sp-clear-btn" title="Clear Scratchpad">🗑️</button>
      </div>
    </div>
    <textarea id="scratchpad-input" placeholder="Type temporary notes here..." spellcheck="false"></textarea>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("scratchpad-toggle-btn");
      const card = document.getElementById("scratchpad-card");
      const textarea = document.getElementById("scratchpad-input");
      
      textarea.value = localStorage.getItem("scratchpad_notes") || "";

      textarea.addEventListener("input", () => {
        localStorage.setItem("scratchpad_notes", textarea.value);
      });

      toggleBtn.addEventListener("click", () => {
        card.classList.toggle("hidden");
        if (!card.classList.contains("hidden")) textarea.focus();
      });

      document.getElementById("sp-copy-btn").addEventListener("click", () => {
        if (textarea.value) navigator.clipboard.writeText(textarea.value);
      });

      document.getElementById("sp-download-btn").addEventListener("click", () => {
        if (!textarea.value) return;
        const blob = new Blob([textarea.value], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "scratchpad-notes.txt";
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("sp-clear-btn").addEventListener("click", () => {
        textarea.value = "";
        localStorage.removeItem("scratchpad_notes");
      });
    });
  </script>
</body>
</html>
