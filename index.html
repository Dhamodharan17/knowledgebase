<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledgebase</title>
  
  <!-- Markdown Parser & GitHub Styling -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">

  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }

    @media (max-width: 767px) {
      .markdown-body { padding: 15px; }
    }

    /* Scratchpad Floating Button */
    .scratchpad-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #0066ff;
      color: white;
      border: none;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s ease, background-color 0.2s ease;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scratchpad-fab:hover { transform: scale(1.08); background-color: #0052cc; }

    /* Scratchpad Card */
    .scratchpad-card {
      position: fixed;
      bottom: 92px;
      right: 24px;
      width: 340px;
      height: 320px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
    }

    .scratchpad-card.hidden { display: none; }

    .scratchpad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .scratchpad-title { font-weight: 600; color: #334155; font-size: 14px; }

    .scratchpad-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .scratchpad-actions button:hover { background-color: #e2e8f0; }

    #scratchpad-input {
      flex: 1;
      padding: 14px;
      border: none;
      resize: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      color: #1e293b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Render Container -->
  <article id="content" class="markdown-body"></article>

  <!-- Scratchpad Widget -->
  <button id="scratchpad-toggle-btn" class="scratchpad-fab" aria-label="Toggle Scratchpad">✏️</button>

  <div id="scratchpad-card" class="scratchpad-card hidden">
    <div class="scratchpad-header">
      <span class="scratchpad-title">Scratchpad</span>
      <div class="scratchpad-actions">
        <button id="sp-copy-btn" title="Copy to Clipboard">📋</button>
        <button id="sp-download-btn" title="Download Notes">⬇️</button>
        <button id="sp-clear-btn" title="Clear Scratchpad">🗑️</button>
      </div>
    </div>
    <textarea id="scratchpad-input" placeholder="Type temporary notes here..." spellcheck="false"></textarea>
  </div>

  <script>
    let currentDocPath = "readme.md";

    // 1. Load Markdown file based on URL Hash or default to README.md
    async function renderPage() {
      const contentDiv = document.getElementById('content');
      const hash = window.location.hash.substring(1);
      
      let filePath = hash ? hash : 'readme.md';
      let targetAnchor = "";

      // Handle internal section links (#file.md#section)
      if (filePath.includes('#')) {
        const parts = filePath.split('#');
        filePath = parts[0];
        targetAnchor = parts[1];
      }

      currentDocPath = filePath;

      try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error("Page not found");
        const text = await response.text();
        
        contentDiv.innerHTML = marked.parse(text);
        
        // Intercept all local .md links to open in SPA mode
        attachLinkInterceptors();

        // Scroll to anchor if specified
        if (targetAnchor) {
          const el = document.getElementById(targetAnchor);
          if (el) el.scrollIntoView();
        } else {
          window.scrollTo(0, 0);
        }
      } catch (err) {
        contentDiv.innerHTML = `<h1>404 - Document Not Found</h1><p>Could not load <code>${filePath}</code></p><a href="#">Back to Home</a>`;
      }
    }

    // 2. Intercept clicks on links pointing to .md files
    function attachLinkInterceptors() {
      const links = document.querySelectorAll('#content a');
      links.forEach(link => {
        const href = link.getAttribute('href');
        
        if (href && (href.endsWith('.md') || href.includes('.md#'))) {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Resolve relative paths based on current directory
            let targetPath = new URL(href, window.location.href.origin + window.location.pathname + "/../" + currentDocPath).pathname;
            
            // Format path relative to repo root
            const basePath = window.location.pathname;
            if (targetPath.startsWith(basePath)) {
              targetPath = targetPath.substring(basePath.length);
            }
            if (targetPath.startsWith('/')) targetPath = targetPath.substring(1);

            window.location.hash = targetPath;
          });
        }
      });
    }

    // Listen for hash changes (Browser Back/Forward buttons)
    window.addEventListener('hashchange', renderPage);
    window.addEventListener('DOMContentLoaded', renderPage);

    // 3. Scratchpad Widget Functionality
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("scratchpad-toggle-btn");
      const card = document.getElementById("scratchpad-card");
      const textarea = document.getElementById("scratchpad-input");
      
      textarea.value = localStorage.getItem("scratchpad_notes") || "";

      textarea.addEventListener("input", () => {
        localStorage.setItem("scratchpad_notes", textarea.value);
      });

      toggleBtn.addEventListener("click", () => {
        card.classList.toggle("hidden");
        if (!card.classList.contains("hidden")) textarea.focus();
      });

      document.getElementById("sp-copy-btn").addEventListener("click", () => {
        if (textarea.value) navigator.clipboard.writeText(textarea.value);
      });

      document.getElementById("sp-download-btn").addEventListener("click", () => {
        if (!textarea.value) return;
        const blob = new Blob([textarea.value], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "scratchpad-notes.txt";
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("sp-clear-btn").addEventListener("click", () => {
        textarea.value = "";
        localStorage.removeItem("scratchpad_notes");
      });
    });
  </script>
</body>
</html>
